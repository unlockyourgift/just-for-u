<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Unlock Your Gift</title>

<style>
body{
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
    padding-top:150px;
}

input{
    padding:10px;
    width:220px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#terminal{
    color:#00ff00;
    font-family:Courier New, monospace;
    font-size:22px;
    white-space:pre-line;
    text-align:center;
    line-height:1.8;
    width:100%;
    margin-top:120px;
}
}
</style>

</head>

<body>

<div id="loginBox">

<h1>PRIVATE ACCESS REQUIRED</h1>

<br>

<input id="username" type="text" placeholder="Username">

<br><br>

<input id="password" type="password" placeholder="Password">

<br><br>

<button onclick="login()">LOGIN</button>

<p id="message"></p>

</div>

<script>

function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "love of my life" && pass === "110790"){

        document.body.innerHTML = `
        <div id="terminal"></div>
        `;

        let text =
`> ACCESS GRANTED ❤️

> Initializing birthday protocol...

> Loading memories...
██████████ 100%

> Checking happiness level...
COMPLETE

> Searching for the best thing that happened to me...

> Result found ✓`;

        let i = 0;

        function typeWriter(){

            if(i < text.length){

                document.getElementById("terminal").innerHTML += text.charAt(i);

                i++;

                setTimeout(typeWriter,35);

            }else{

                setTimeout(function(){

                   document.getElementById("terminal").innerHTML += `

<br><br>

<button id="continueBtn"
style="
opacity:0;
transition:opacity 1.5s ease;
background:black;
color:#00ff00;
border:1px solid #00ff00;
padding:12px 25px;
font-size:20px;
font-family:Courier New;
cursor:pointer;
"
onclick="showMessagePage()"
>
[ CONTINUE ]
</button>

`;

setTimeout(function(){
    document.getElementById("continueBtn").style.opacity="1";
},100);

                },3000);

            }

        }

        typeWriter();

    }

    else{

        document.getElementById("message").innerHTML =
        "Wrong credentials";

    }

}
function showMessagePage(){

document.body.innerHTML = `

<div style="
background:black;
color:white;
font-family:Arial;
text-align:center;
padding-top:120px;
height:100vh;
">

<h1 id="line1" style="opacity:0;transition:opacity 1.5s ease;">Happy Birthday, My Love ❤️</h1>

<p id="line2" style="opacity:0;transition:opacity 1.5s ease;font-size:24px;">
Today is all about you.
</p>

<p id="line3" style="opacity:0;transition:opacity 1.5s ease;font-size:24px;">
There are many things I could have given you today...
</p>

<p id="line4" style="opacity:0;transition:opacity 1.5s ease;font-size:24px;">
But I wanted to give you something that lasts longer than a gift.
</p>

<p id="line5" style="opacity:0;transition:opacity 1.5s ease;font-size:24px;">
Something made only for you.
</p>

<br><br>

<button id="surpriseBtn"
style="
opacity:0;
transition:opacity 1.5s ease;
background:black;
color:white;
border:1px solid white;
padding:15px 30px;
font-size:20px;
cursor:pointer;
">
[ OPEN YOUR SURPRISE ]
</button>

</div>

`;

setTimeout(()=>{document.getElementById("line1").style.opacity="1";},500);
setTimeout(()=>{document.getElementById("line2").style.opacity="1";},1800);
setTimeout(()=>{document.getElementById("line3").style.opacity="1";},3300);
setTimeout(()=>{document.getElementById("line4").style.opacity="1";},4800);
setTimeout(()=>{document.getElementById("line5").style.opacity="1";},6300);

setTimeout(()=>{
document.getElementById("surpriseBtn").style.opacity="1";
},12300);

}
</script>

</body>
</html>
