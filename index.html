function typeWriter(id, text, speed, callback) {

let i = 0;
let element = document.getElementById(id);

function typing() {

if (i < text.length) {

element.innerHTML += text.charAt(i);
i++;

setTimeout(typing, speed);

} else {

if (callback) callback();

}

}

typing();

}
